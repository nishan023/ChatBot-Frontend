<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dhakal AI Chatbot Widget</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css"
      rel="stylesheet" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet" />
    <style>
      /* Main chatbot styles */
      .chatbot-widget {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 9999;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }

      /* Chat toggle button */
      .chat-toggle {
        width: 60px;
        height: 60px;
        background: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #60a5fa 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }

      .chat-toggle::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: linear-gradient(45deg, transparent, rgba(255,255,255,0.2), transparent);
        transform: rotate(45deg);
        animation: shimmer 3s infinite;
      }

      @keyframes shimmer {
        0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
        50% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        100% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
      }

      .chat-toggle:hover {
        transform: scale(1.05);
        box-shadow: 0 6px 25px rgba(59, 130, 246, 0.6);
        background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 50%, #3b82f6 100%);
      }

      .chat-toggle i {
        color: white;
        font-size: 24px;
        transition: all 0.3s ease;
        z-index: 1;
        position: relative;
      }

      .chat-toggle.active i.fa-robot {
        transform: rotate(180deg);
        opacity: 0;
      }

      .chat-toggle.active i.fa-times {
        transform: rotate(0deg);
        opacity: 1;
      }

      .chat-toggle i.fa-times {
        position: absolute;
        transform: rotate(-180deg);
        opacity: 0;
      }

      /* Animated robot icon */
      .chat-toggle i.fa-robot {
        animation: robotBounce 2s ease-in-out infinite;
      }

      @keyframes robotBounce {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        25% { transform: translateY(-2px) rotate(-5deg); }
        50% { transform: translateY(0) rotate(0deg); }
        75% { transform: translateY(-2px) rotate(5deg); }
      }

      /* Notification badge */
      .notification-badge {
        position: absolute;
        top: -5px;
        right: -5px;
        background: #ef4444;
        color: white;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: pulse 2s infinite;
        z-index: 2;
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
        100% {
          transform: scale(1);
        }
      }

      /* Chat container */
      .chat-container {
        position: absolute;
        bottom: 80px;
        right: 0;
        width: 350px;
        height: 500px;
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(30, 64, 175, 0.15);
        display: none;
        flex-direction: column;
        overflow: hidden;
        animation: slideUp 0.3s ease-out;
        border: 1px solid rgba(59, 130, 246, 0.1);
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Chat header */
      .chat-header {
        background: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #60a5fa 100%);
        color: white;
        padding: 20px;
        text-align: center;
        position: relative;
      }

      .chat-header h5 {
        margin: 0;
        font-weight: 700;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .chat-header .robot-icon {
        animation: headerRobotPulse 2s ease-in-out infinite;
      }

      @keyframes headerRobotPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
      }

      .chat-header p {
        margin: 5px 0 0 0;
        font-size: 13px;
        opacity: 0.9;
      }

      .beta-badge {
        position: absolute;
        top: 15px;
        left: 15px;
        background: rgba(255, 255, 255, 0.2);
        color: white;
        padding: 4px 8px;
        border-radius: 12px;
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .online-indicator {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 8px;
        height: 8px;
        background: #10b981;
        border-radius: 50%;
        animation: blink 2s infinite;
        box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
      }

      @keyframes blink {
        0%,
        50% {
          opacity: 1;
        }
        51%,
        100% {
          opacity: 0.3;
        }
      }

      /* Chat messages area */
      .chat-messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
      }

      .chat-messages::-webkit-scrollbar {
        width: 6px;
      }

      .chat-messages::-webkit-scrollbar-track {
        background: #e2e8f0;
        border-radius: 10px;
      }

      .chat-messages::-webkit-scrollbar-thumb {
        background: #94a3b8;
        border-radius: 10px;
      }

      .chat-messages::-webkit-scrollbar-thumb:hover {
        background: #64748b;
      }

      /* Message bubbles */
      .message {
        margin-bottom: 15px;
        animation: fadeInUp 0.3s ease-out;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message-user {
        text-align: right;
      }

      .message-bot {
        text-align: left;
      }

      .message-bubble {
        display: inline-block;
        max-width: 80%;
        padding: 12px 16px;
        border-radius: 18px;
        font-size: 14px;
        line-height: 1.4;
        word-wrap: break-word;
      }

      .message-user .message-bubble {
        background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
        color: white;
        border-bottom-right-radius: 4px;
        box-shadow: 0 2px 10px rgba(59, 130, 246, 0.3);
      }

      .message-bot .message-bubble {
        background: white;
        color: #1e293b;
        border: 1px solid #e2e8f0;
        border-bottom-left-radius: 4px;
        box-shadow: 0 2px 5px rgba(30, 64, 175, 0.05);
      }

      .message-time {
        font-size: 11px;
        color: #64748b;
        margin-top: 5px;
      }

      /* Typing indicator */
      .typing-indicator {
        display: none;
        padding: 15px;
        text-align: left;
      }

      .typing-dots {
        display: inline-block;
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        padding: 12px 16px;
        box-shadow: 0 2px 5px rgba(30, 64, 175, 0.05);
      }

      .typing-dots span {
        height: 8px;
        width: 8px;
        background: #3b82f6;
        border-radius: 50%;
        display: inline-block;
        margin-right: 3px;
        animation: typing 2s infinite;
      }

      .typing-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }

      .typing-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes typing {
        0%,
        60%,
        100% {
          transform: translateY(0);
          opacity: 0.4;
        }
        30% {
          transform: translateY(-10px);
          opacity: 1;
        }
      }

      /* Chat input area */
      .chat-input-area {
        padding: 20px;
        background: white;
        border-top: 1px solid #e2e8f0;
      }

      .input-group {
        background: #f8fafc;
        border-radius: 25px;
        padding: 5px;
        border: 1px solid #e2e8f0;
        transition: all 0.3s ease;
      }

      .input-group:focus-within {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        background: white;
      }

      #chatInput {
        border: none;
        background: transparent;
        padding: 10px 15px;
        outline: none;
        font-size: 14px;
        flex: 1;
        color: #1e293b;
      }

      #chatInput::placeholder {
        color: #64748b;
      }

      .send-btn {
        background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
        border: none;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
      }

      .send-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
      }

      .send-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .send-btn i {
        color: white;
        font-size: 16px;
      }

      /* Welcome message */
      .welcome-message {
        text-align: center;
        padding: 20px;
        color: #475569;
      }

      .welcome-message i {
        font-size: 48px;
        color: #3b82f6;
        margin-bottom: 15px;
        animation: welcomeRobotFloat 3s ease-in-out infinite;
      }

      @keyframes welcomeRobotFloat {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        33% { transform: translateY(-5px) rotate(-2deg); }
        66% { transform: translateY(5px) rotate(2deg); }
      }

      .welcome-message h6 {
        color: #1e40af;
        font-weight: 600;
        margin-bottom: 8px;
      }

      /* Mobile responsiveness */
      @media (max-width: 480px) {
        .chat-container {
          width: 320px;
          height: 450px;
          bottom: 80px;
          right: 10px;
        }

        .chatbot-widget {
          bottom: 15px;
          right: 15px;
        }

        .chat-toggle {
          width: 55px;
          height: 55px;
        }

        .chat-toggle i {
          font-size: 22px;
        }
      }

      /* Error state */
      .error-message {
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #dc2626;
        padding: 10px;
        border-radius: 10px;
        margin: 10px 0;
        font-size: 13px;
      }

      /* Powered by footer */
      .powered-by {
        position: absolute;
        bottom: 5px;
        left: 20px;
        font-size: 10px;
        color: rgba(255, 255, 255, 0.7);
      }
    </style>
  </head>
  <body>
    <div class="chatbot-widget">
      <!-- Chat Toggle Button -->
      <div class="chat-toggle" id="chatToggle">
        <i class="fas fa-robot"></i>
        <i class="fas fa-times"></i>
        <div
          class="notification-badge"
          id="notificationBadge"
          style="display: none">
          1
        </div>
      </div>

      <!-- Chat Container -->
      <div class="chat-container" id="chatContainer">
        <!-- Chat Header -->
        <div class="chat-header">
          <div class="beta-badge">Beta 1.0.1</div>
          <div class="online-indicator"></div>
          <h5>
            <i class="fas fa-robot robot-icon"></i>
            Dhakal AI
          </h5>
          <p>Your intelligent assistant is here to help!</p>
          <div class="powered-by">Powered by Gemini</div>
        </div>

        <!-- Chat Messages -->
        <div class="chat-messages" id="chatMessages">
          <div class="welcome-message">
            <i class="fas fa-robot"></i>
            <h6>Welcome to Dhakal AI!</h6>
            <p>Hello! I'm your intelligent AI assistant. How can I help you today?</p>
          </div>
        </div>

        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typingIndicator">
          <div class="typing-dots">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>

        <!-- Chat Input -->
        <div class="chat-input-area">
          <div class="input-group">
            <input
              type="text"
              id="chatInput"
              placeholder="Ask Dhakal AI anything..."
              maxlength="500" />
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">
              <i class="fas fa-paper-plane"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
      // Configuration - Update this with your API endpoint
      const API_ENDPOINT = "https://the-csit-vault-chatbot.onrender.com/api/chatbot/ask";

      // DOM elements
      const chatToggle = document.getElementById("chatToggle");
      const chatContainer = document.getElementById("chatContainer");
      const chatMessages = document.getElementById("chatMessages");
      const chatInput = document.getElementById("chatInput");
      const sendBtn = document.getElementById("sendBtn");
      const typingIndicator = document.getElementById("typingIndicator");
      const notificationBadge = document.getElementById("notificationBadge");

      // State
      let isOpen = false;
      let isTyping = false;

      // Initialize chatbot
      function initChatbot() {
        // Toggle chat window
        chatToggle.addEventListener("click", toggleChat);

        // Send message on Enter key
        chatInput.addEventListener("keypress", function (e) {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
          }
        });

        // Auto-focus input when chat opens
        chatInput.addEventListener("focus", function () {
          hideNotification();
        });

        // Show welcome notification after 3 seconds
        setTimeout(() => {
          if (!isOpen) {
            showNotification();
          }
        }, 3000);
      }

      // Toggle chat window
      function toggleChat() {
        isOpen = !isOpen;
        chatToggle.classList.toggle("active");

        if (isOpen) {
          chatContainer.style.display = "flex";
          chatInput.focus();
          hideNotification();
        } else {
          chatContainer.style.display = "none";
        }
      }

      // Show notification badge
      function showNotification() {
        notificationBadge.style.display = "flex";
      }

      // Hide notification badge
      function hideNotification() {
        notificationBadge.style.display = "none";
      }

      // Add message to chat
      function addMessage(message, isUser = false) {
        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${
          isUser ? "message-user" : "message-bot"
        }`;

        const currentTime = new Date().toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
        });

        messageDiv.innerHTML = `
                <div class="message-bubble">${message}</div>
                <div class="message-time">${currentTime}</div>
            `;

        chatMessages.appendChild(messageDiv);
        scrollToBottom();
      }

      // Add error message
      function addErrorMessage(message) {
        const errorDiv = document.createElement("div");
        errorDiv.className = "error-message";
        errorDiv.innerHTML = `<i class="fas fa-exclamation-triangle"></i> ${message}`;
        chatMessages.appendChild(errorDiv);
        scrollToBottom();
      }

      // Show typing indicator
      function showTyping() {
        isTyping = true;
        typingIndicator.style.display = "block";
        scrollToBottom();
      }

      // Hide typing indicator
      function hideTyping() {
        isTyping = false;
        typingIndicator.style.display = "none";
      }

      // Scroll to bottom of messages
      function scrollToBottom() {
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      // Send message
      async function sendMessage() {
        const message = chatInput.value.trim();

        if (!message || isTyping) return;

        // Add user message
        addMessage(message, true);
        chatInput.value = "";

        // Disable send button and show typing
        sendBtn.disabled = true;
        showTyping();

        try {
          // Make API request
          const response = await fetch(API_ENDPOINT, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              prompt: message,
              timestamp: new Date().toISOString(),
            }),
          });

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          const data = await response.json();

          // Simulate typing delay for better UX
          setTimeout(() => {
            hideTyping();
            addMessage(
              data.reply ||
                "Sorry, I didn't understand that. Could you please rephrase?"
            );
            sendBtn.disabled = false;
          }, 1000);
        } catch (error) {
          console.error("Error sending message:", error);
          hideTyping();
          addErrorMessage(
            "Sorry, I'm having trouble connecting. Please try again later."
          );
          sendBtn.disabled = false;
        }
      }

      // Initialize when DOM is loaded
      document.addEventListener("DOMContentLoaded", initChatbot);

      // Handle window resize for mobile
      window.addEventListener("resize", function () {
        if (isOpen && window.innerWidth <= 480) {
          scrollToBottom();
        }
      });

      // Prevent parent page scrolling when chat is open
      chatMessages.addEventListener("touchmove", function (e) {
        e.stopPropagation();
      });
    </script>
  </body>
</html>
