<script>
// Keep this script XML-safe for Blogger without CDATA wrappers.
(() => {
  'use strict';
  const template = document.getElementById('csit-vault-template');
  if (!template || document.getElementById('csit-vault-widget')) return;
  const host = document.createElement('div');
  host.id = 'csit-vault-widget';
  const root = host.attachShadow({ mode: 'open' });
  root.append(template.content.cloneNode(true));
  (document.body || document.documentElement).append(host);
  const $ = id => root.getElementById(id);
  // Public URL only: never put your Gemini API key in this file.
  const apiBase = 'https://the-csit-vault-chatbot-1.onrender.com';
  let panelOpen = false;
  let panelAnimationTimer;
  function toggle(open) {
    if (open === panelOpen) return;
    panelOpen = open;
    clearTimeout(panelAnimationTimer);
    const panel = $('chatPanel');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    panel.classList.remove('is-opening', 'is-closing');
    panel.inert = !open;
    $('launcher').setAttribute('aria-expanded', String(open));
    $('launcher').setAttribute('aria-label', open ? 'Collapse CSIT Vault AI' : 'Open CSIT Vault AI');
    if (open) {
      panel.hidden = false;
      if (!reduceMotion) {
        panel.classList.add('is-opening');
        panelAnimationTimer = setTimeout(() => panel.classList.remove('is-opening'), 200);
      }
      syncInput();
      input.focus({ preventScroll: true });
    } else {
      $('launcher').focus();
      if (reduceMotion) panel.hidden = true;
      else {
        panel.classList.add('is-closing');
        panelAnimationTimer = setTimeout(() => {
          panel.hidden = true;
          panel.classList.remove('is-closing');
        }, 180);
      }
    }
  }
  const input = $('chatInput');
  let history = [];
  let pending = null;
  let generation = 0;
  let healthGeneration = 0;
  let healthRetryTimer;
  let lastPrompt = '';
  let serviceUnavailable = false;
  let retryIsHealthCheck = false;
  let toastTimer;
  function icon(name) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    const symbol = $('i-' + name);
    svg.setAttribute('viewBox', symbol.getAttribute('viewBox'));
    svg.append(...Array.from(symbol.childNodes, node => node.cloneNode(true)));
    svg.setAttribute('aria-hidden', 'true');
    return svg;
  }

  function syncInput() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 145) + 'px';
    $('characterCount').textContent = input.value.length + ' / 4000';
    $('sendButton').disabled = !input.value.trim() || Boolean(pending) || serviceUnavailable;
  }

  function fillPrompt(text) {
    input.value = text;
    syncInput();
    input.focus();
  }

  function setStatus(text, mode = '') {
    $('connectionStatus').textContent = text;
    $('statusDot').className = 'status-dot ' + mode;
    $('statusDot').title = text;
  }

  async function checkHealth(attempt = 0) {
    clearTimeout(healthRetryTimer);
    const healthId = ++healthGeneration;
    const chatId = generation;
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 90000);
    setStatus('Connecting…');
    try {
      const response = await fetch(apiBase + '/health', { signal: controller.signal, cache: 'no-store' });
      if (!response.ok) throw new Error('HTTP_' + response.status);
      let data;
      try { data = await response.json(); } catch { throw new Error('INVALID_RESPONSE'); }
      if (!data || data.status !== 'OK') throw new Error('INVALID_RESPONSE');
      if (healthId !== healthGeneration || chatId !== generation) return;
      serviceUnavailable = data.apiKeyConfigured === false || ['not_configured', 'unavailable'].includes(data.aiStatus);
      setStatus(serviceUnavailable ? 'Temporarily unavailable' : data.aiStatus === 'ready' ? 'Ready to help' : 'Server connected', serviceUnavailable ? 'offline' : 'ready');
      if (serviceUnavailable) showError('The site owner needs to restore the AI connection. Please check back later.', { configuration: true });
      if (retryIsHealthCheck) {
        if (serviceUnavailable) {
          $('errorText').textContent = 'The assistant is still unavailable. The site owner needs to restore the AI connection.';
        } else {
          $('errorNotice').hidden = true;
          retryIsHealthCheck = false;
        }
      }
    } catch (error) {
      if (healthId !== healthGeneration || chatId !== generation) return;
      console.warn('CSIT Vault health check failed:', apiBase + '/health', error);
      setStatus('Connection unavailable', 'offline');
      const detail = error.name === 'AbortError'
        ? 'The server took too long to respond. It may still be starting up.'
        : error.message === 'INVALID_RESPONSE'
          ? 'The connection check returned an unexpected response.'
          : error.message.startsWith('HTTP_')
            ? 'The connection check returned HTTP ' + error.message.slice(5) + '.'
            : 'Your browser could not complete the connection check. This may be a temporary network issue or a request blocked by the page or browser.';
      showError(detail + (attempt === 0 ? ' Retrying the connection check shortly. You can still try sending a question.' : ' Try sending a question or select Check connection.'), { connection: true });
      if (attempt === 0) {
        healthRetryTimer = setTimeout(() => {
          if (healthId !== healthGeneration || chatId !== generation) return;
          checkHealth(1);
        }, 4000);
      }
    } finally { clearTimeout(timeout); syncInput(); }
  }

  function toast(text) {
    clearTimeout(toastTimer);
    $('toast').textContent = text;
    $('toast').hidden = false;
    toastTimer = setTimeout(() => { $('toast').hidden = true; }, 2500);
  }

  const copyTimers = new WeakMap();
  async function copyText(text, feedback) {
    clearTimeout(copyTimers.get(feedback));
    try {
      await navigator.clipboard.writeText(text);
      feedback.textContent = 'Copied to clipboard';
    } catch {
      feedback.textContent = 'Copy unavailable. Select the text and copy it manually.';
    }
    feedback.hidden = false;
    clearTimeout(copyTimers.get(feedback));
    copyTimers.set(feedback, setTimeout(() => { feedback.hidden = true; }, 2500));
  }

  function cleanAnswer(text) {
    // Keep code contents literal; remove presentation markers only from prose.
    return text.split(/(```[^\n]*\n[\s\S]*?```|`[^`\n]+`)/g).map(part => {
      if (part.startsWith('```')) return part.replace(/^```[^\n]*\n/, '').replace(/```$/, '');
      if (part.startsWith('`')) {
        if (part.endsWith('`')) return part.slice(1, -1);
      }
      return part
        .replace(/\\([*_~`#])/g, '$1')
        .replace(/!\[([^\]]*)\]\([^)]+\)/g, '$1')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1 ($2)')
        .replace(/^ {0,3}#{1,6}\s+/gm, '')
        .replace(/^\s{0,3}>\s?/gm, '')
        .replace(/^ {0,3}(?:\*{3,}|-{3,}|_{3,})\s*$/gm, '')
        .replace(/\*\*([\s\S]+?)\*\*/g, '$1')
        .replace(/__([^\n]+?)__/g, '$1')
        .replace(/~~([^\n]+?)~~/g, '$1')
        .replace(/(^|\s)\*([^*\s](?:[^*\n]*?[^*\s])?)\*(?=\s|[.,!?;:]|$)/g, '$1$2')
        .replace(/(^|\s)_([^_\s](?:[^_\n]*?[^_\s])?)_(?=\s|[.,!?;:]|$)/g, '$1$2')
        .replace(/^(\s*)[-*+]\s+/gm, '$1\u2022 ');
    }).join('').trim();
  }

  function appendMessage(text, role) {
    const article = document.createElement('article');
    article.className = 'message ' + role;
    if (role === 'assistant') {
      const avatar = document.createElement('span');
      avatar.className = 'mini-avatar';
      avatar.append(icon('spark'));
      article.append(avatar);
    }
    const content = document.createElement('div');
    content.className = 'message-content';
    const label = document.createElement('div');
    label.className = 'message-label';
    label.textContent = role === 'user' ? '' : 'CSIT Vault';
    const time = document.createElement('time');
    const now = new Date();
    time.dateTime = now.toISOString();
    time.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    label.append(time);
    const body = document.createElement('div');
    body.className = 'message-body';
    const displayText = role === 'assistant' ? cleanAnswer(text) : text;
    body.textContent = displayText;
    body.classList.add('plain');
    content.append(label, body);
    if (role === 'assistant') {
      const copy = document.createElement('button');
      copy.type = 'button';
      copy.className = 'copy-button';
      copy.append(icon('copy'), document.createTextNode('Copy answer'));
      const feedback = document.createElement('div');
      feedback.className = 'copy-feedback';
      feedback.setAttribute('role', 'status');
      feedback.hidden = true;
      copy.addEventListener('click', () => copyText(displayText, feedback));
      content.append(copy, feedback);
    }
    article.append(content);
    $('messages').append(article);
    scrollToEnd();
  }

  function scrollToEnd() { $('scrollRegion').scrollTop = $('scrollRegion').scrollHeight; }

  function showError(message, { retryable = false, configuration = false, connection = false } = {}) {
    $('errorTitle').textContent = configuration ? 'The assistant is taking a break' : connection ? 'Connection check interrupted' : "Couldn't get an answer";
    $('errorText').textContent = message;
    $('errorNotice').hidden = false;
    retryIsHealthCheck = configuration || connection;
    $('retryButton').hidden = !(retryable || retryIsHealthCheck);
    $('retryButton').textContent = retryIsHealthCheck ? 'Check connection' : 'Try again';
    $('editButton').hidden = !lastPrompt;
    serviceUnavailable = configuration;
    scrollToEnd();
  }

  async function sendMessage(text, isRetry = false) {
    if (!text.trim() || pending || serviceUnavailable) return;
    if (text.length > 4000) { toast('Please keep your question under 4,000 characters.'); return; }
    text = text.trim();
    clearTimeout(healthRetryTimer);
    retryIsHealthCheck = false;
    const id = ++generation;
    const controller = new AbortController();
    pending = controller;
    const timeout = setTimeout(() => controller.abort(), 90000);
    lastPrompt = text;
    $('errorNotice').hidden = true;
    $('welcomeSection').hidden = true;
    if (!isRetry) appendMessage(text, 'user');
    input.value = '';
    syncInput();
    $('typingIndicator').hidden = false;
    $('messages').setAttribute('aria-busy', 'true');
    setStatus('Thinking it through…');
    scrollToEnd();
    try {
      const response = await fetch(apiBase + '/api/chatbot/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: text, history }),
        signal: controller.signal
      });
      let data;
      try { data = await response.json(); } catch { throw new Error('INVALID_RESPONSE'); }
      if (id !== generation) return;
      if (!response.ok || data.success === false) {
        // Do not render raw errors from an older backend as assistant answers.
        const configuration = ['API_KEY_REVOKED', 'API_KEY_INVALID', 'API_KEY_MISSING', 'MODEL_UNAVAILABLE'].includes(data.code);
        const messages = {
          API_KEY_REVOKED: 'The site owner needs to update the AI connection. Your question is still here; please check back later.',
          API_KEY_INVALID: 'The site owner needs to check the AI connection. Please check back later.',
          API_KEY_MISSING: 'The assistant is still being set up. Please check back soon.',
          MODEL_UNAVAILABLE: 'The assistant needs a service update. Please check back later.',
          RATE_LIMITED: 'The assistant has reached its usage limit. Please try again later.',
          AI_TIMEOUT: 'That took longer than expected. Your question is saved here so you can try again.',
          AI_UNAVAILABLE: 'The assistant could not connect right now. Please try again shortly.',
          EMPTY_RESPONSE: 'No answer came back. Try again or edit your question.',
          RESPONSE_BLOCKED: 'The assistant could not answer that question. Try rephrasing it as a study question.',
          INVALID_HISTORY: 'The conversation context is invalid. Start a new chat and try again.',
          INVALID_PROMPT: 'Please enter a question between 1 and 4,000 characters.'
        };
        showError(messages[data.code] || 'The assistant could not answer right now. Please try again later.', { configuration, retryable: data.retryable === true || (data.code ? false : response.status >= 500) });
        setStatus(configuration ? 'Temporarily unavailable' : 'Answer interrupted', 'offline');
        return;
      }
      if (typeof data.reply !== 'string' || !data.reply.trim()) throw new Error('INVALID_RESPONSE');
      appendMessage(data.reply, 'assistant');
      history.push({ role: 'user', text }, { role: 'model', text: data.reply.slice(0, 30000) });
      history = history.slice(-10);
      setStatus('Ready to help', 'ready');
    } catch (error) {
      if (id !== generation) return;
      showError(error.name === 'AbortError' ? 'The request timed out. Please try again in a moment.' : error.message === 'INVALID_RESPONSE' ? 'The server returned an unexpected response. Please try again later.' : 'Unable to connect. Check your internet connection and try again.', { retryable: true });
      setStatus('Connection interrupted', 'offline');
    } finally {
      clearTimeout(timeout);
      if (id === generation) {
        pending = null;
        $('typingIndicator').hidden = true;
        $('messages').setAttribute('aria-busy', 'false');
        syncInput();
        input.focus({ preventScroll: true });
      }
    }
  }

  function newChat() {
    ++generation;
    pending?.abort();
    pending = null;
    history = [];
    lastPrompt = '';
    retryIsHealthCheck = false;
    $('messages').replaceChildren();
    $('messages').setAttribute('aria-busy', 'false');
    $('welcomeSection').hidden = false;
    $('typingIndicator').hidden = true;
    $('errorNotice').hidden = true;
    input.value = '';
    syncInput();
    $('scrollRegion').scrollTop = 0;
    checkHealth();
    input.focus({ preventScroll: true });
  }

  $('chatForm').addEventListener('submit', event => { event.preventDefault(); sendMessage(input.value); });
  input.addEventListener('input', syncInput);
  input.addEventListener('keydown', event => {
    if (event.key !== 'Enter' || event.shiftKey || event.isComposing) return;
    event.preventDefault();
    sendMessage(input.value);
  });
  root.querySelectorAll('[data-prompt]').forEach(button => {
    button.addEventListener('click', () => {
      if (pending || serviceUnavailable) { fillPrompt(button.dataset.prompt); return; }
      sendMessage(button.dataset.prompt);
    });
  });
  root.querySelectorAll('[data-new-chat]').forEach(button => button.addEventListener('click', newChat));
  $('retryButton').addEventListener('click', () => retryIsHealthCheck ? checkHealth() : sendMessage(lastPrompt, true));
  $('editButton').addEventListener('click', () => fillPrompt(lastPrompt));
  $('closeChat').addEventListener('click', () => toggle(false));
  $('launcher').addEventListener('click', () => toggle(!panelOpen));
  root.addEventListener('keydown', event => {
    if (event.key === 'Escape') toggle(false);
  });
  root.querySelectorAll('svg use').forEach(use => {
    const symbol = $(use.getAttribute('href').slice(1));
    use.parentNode.setAttribute('viewBox', symbol.getAttribute('viewBox'));
    use.replaceWith(...Array.from(symbol.childNodes, node => node.cloneNode(true)));
  });
  syncInput();
  checkHealth();
})();
</script>
<!-- BLOGGER WIDGET END -->
</body>
</html>
